name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy midway - a half-applied release is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_ROOT: /srv/www/griffithhiking.club
  KEEP_RELEASES: 5
  # Fail a stalled connection quickly so a retry can happen, and keep long
  # transfers alive.
  SSH_OPTS: "-o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=6"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://griffithhiking.club
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `main` is protected by CI, but re-checking here means a type error can
      # never reach production even if the branch protection is bypassed.
      - run: pnpm check

      - run: pnpm build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A secret can pick up stray whitespace when it is set, which makes
          # every later ssh and rsync fail for a reason nothing reports.
          host="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          echo "VPS_TARGET=$host" >>"$GITHUB_ENV"

          # Length and digest rather than the value, so a malformed secret is
          # visible in the log without exposing it.
          printf 'host secret: %s bytes, sha256 %s\n' \
            "$(printf '%s' "$host" | wc -c | tr -d ' ')" \
            "$(printf '%s' "$host" | sha256sum | cut -c1-12)"

          # Host key comes from the repo instead of ssh-keyscan at runtime.
          cat infra/known_hosts >>~/.ssh/known_hosts

      # This host intermittently does not answer TCP 22 promptly from GitHub
      # runners - the same flake that made ssh-keyscan fail at its 5s default,
      # and that griffith-ict-web already works around with retries. So wait for
      # the host rather than gate on a single attempt.
      - name: Wait for the VPS to accept SSH
        run: |
          for attempt in 1 2 3 4 5; do
            if timeout 20 bash -c ": </dev/tcp/$VPS_TARGET/22"; then
              echo "TCP 22 answered on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: no answer on TCP 22, retrying in 15s"
            sleep 15
          done
          echo "::error::TCP 22 on the deploy target never answered after 5 attempts"
          exit 1

      - name: Upload release
        run: |
          RELEASE="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >>"$GITHUB_ENV"
          echo "Uploading to $SITE_ROOT/releases/$RELEASE"
          # Explicit modes so the result never depends on the runner's umask;
          # nginx workers read these as 'other'.
          # Re-running rsync into the same directory resumes rather than
          # duplicating, so retrying is safe.
          for attempt in 1 2 3; do
            if rsync -a --delete --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/deploy_key $SSH_OPTS" \
              dist/ "deploy@$VPS_TARGET:$SITE_ROOT/releases/$RELEASE/"; then
              echo "uploaded on attempt $attempt"
              exit 0
            fi
            echo "rsync attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "::error::rsync failed after 3 attempts"
          exit 1

      # Piped over stdin rather than inlined, so the script stays a real file in
      # the repo that can be read and linted on its own.
      - name: Activate release
        run: |
          # Swapping the symlink is idempotent, so this is safe to repeat.
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key $SSH_OPTS "deploy@$VPS_TARGET" \
              "SITE_ROOT='$SITE_ROOT' RELEASE='$RELEASE' KEEP='$KEEP_RELEASES' bash -s" \
              <infra/activate-release.sh; then
              exit 0
            fi
            echo "activate attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "::error::could not activate the release after 3 attempts"
          exit 1

      - name: Verify the site responds
        run: |
          # Checked by Host header so this passes before DNS is pointed.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: griffithhiking.club' "http://$VPS_TARGET/")
          echo "origin returned $code"
          test "$code" = "200"
