name: CI

on:
  pull_request:
  push:
    # `content` is included so the required `check` context lands on that SHA. A
    # pull request opened with GITHUB_TOKEN does not trigger workflows, so without
    # this the auto-merge would wait forever for a check that never runs.
    branches: [main, content]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so the pnpm binary exists for its cache
      # resolution. Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Raw values may only live in the token layer.
      - run: pnpm check:tokens

      # The CMS config and the content schema must not drift apart.
      - run: pnpm check:cms

      # The date rules decide which hikes are shown at all.
      - run: pnpm test

      # Type-checks .astro templates as well as .ts. Requires TypeScript 6.x:
      # the 7.x native compiler does not expose the API this relies on.
      - run: pnpm check

      - run: pnpm build
